plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tyranor.runtime.rgss'
    compileSdk 33

    defaultConfig {
        // TYN discovers this package through the runtime-module action.
        // The namespace and application ID share the published runtime-module package.
        applicationId "com.tyranor.runtime.rgss"
        minSdk 23
        targetSdk 33
        versionCode 71
        versionName "0.1.45-tyn.1"
        archivesBaseName = "mkxp-z-$versionName"
        ndk.debugSymbolLevel = 'FULL'
    }

    // The signing key is NOT stored in the repo. GitHub Actions puts it in
    // the ANYPLAY_* environment variables from the repository secrets. Every build
    // uses the same key, so a new APK installs over the old one.
    // Without those variables (for example a local test build) Gradle uses its
    // own debug key.
    signingConfigs {
        anyplay {
            def ks = System.getenv('ANYPLAY_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANYPLAY_STORE_PASSWORD')
                keyAlias System.getenv('ANYPLAY_KEY_ALIAS')
                keyPassword System.getenv('ANYPLAY_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            buildConfigField "boolean", "TYN_VERBOSE_DIAGNOSTICS", "false"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // An UNSIGNED APK cannot be installed on Android ("package appears
            // to be invalid"), so sign with the fixed AnyPlay key defined above.
            signingConfig System.getenv('ANYPLAY_KEYSTORE_FILE') ? signingConfigs.anyplay : signingConfigs.debug
        }

        debug {
            debuggable true
            jniDebuggable true
            buildConfigField "boolean", "TYN_VERBOSE_DIAGNOSTICS", "true"
            // When CI has the private signing key, let the diagnostic APK update
            // the installed runtime instead of requiring an uninstall first.
            signingConfig System.getenv('ANYPLAY_KEYSTORE_FILE') ? signingConfigs.anyplay : signingConfigs.debug
        }
    }

    splits {
        abi {
            enable true
            reset()
            // You can build also 'x86' and 'x86_64' if you want (useful for AVD debugging)
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Runtime overlay is written in Kotlin
    kotlinOptions {
        jvmTarget = '1.8'
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
    ndkVersion '23.2.8568313'
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    implementation 'androidx.core:core-ktx:1.9.0'
}
