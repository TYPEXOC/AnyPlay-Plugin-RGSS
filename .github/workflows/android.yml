name: Build AnyPlay RGSS Plugin

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      build_r34:
        description: 'Also build the optional r34 runtime (Ruby 3.4). Slower build. Leave off for a normal release.'
        type: boolean
        default: false
      r34_yjit:
        description: 'r34 only: build Ruby 3.4 with YJIT on arm64 (needs Rust). Ignored when build_r34 is off.'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_NDK_VERSION: 23.2.8568313
      RUBY_VERSION: "3.1"
      # Optional r34 runtime (Ruby 3.4). Off unless the workflow is started by hand with
      # build_r34 ticked; tag pushes always build without it. Read by the Makefile and
      # by ndk-build (Android.mk).
      BUILD_R34: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_r34 == 'true') && '1' || '0' }}
      BUILD_R34_YJIT: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_r34 == 'true' && github.event.inputs.r34_yjit == 'true') && '1' || '0' }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Java (required by Gradle / Android SDK) ───────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. System dependencies ───────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake curl gpg xxd \
            ruby-full autoconf automake libtool pkg-config \
            python3 git unzip bison gperf

      # ── 4. Ruby  ──────────────────────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      # ── 5. Android SDK ────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # AnyPlay fix: the default package list ("tools platform-tools") fails with
          # "Failed to find package 'tools'" because 'tools' no longer exists.
          # Install nothing here; the NDK is installed by the next step.
          packages: ''

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      # ── 5b. Rust (only for r34 with YJIT) ────────────────────────────────────
      - name: Set up Rust for YJIT (r34)
        if: env.BUILD_R34_YJIT == '1'
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add aarch64-linux-android
          rustc --version

      # ── 6. Export toolchain paths ─────────────────────────────────────────────
      - name: Export NDK toolchain paths
        run: |
          ARCH=linux-x86_64
          NDK_PATH="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/$ARCH/bin"
          echo "ANDROID_HOME=$ANDROID_HOME"           >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH"           >> "$GITHUB_ENV"
          echo "ARCH=$ARCH"                            >> "$GITHUB_ENV"
          echo "$TOOLCHAIN"                            >> "$GITHUB_PATH"

      # ── 7. Download JNI dependencies & Generate XXD ──────────────────────────
      - name: Download JNI dependencies (get_deps.sh)
        working-directory: app/jni
        run: |
          chmod +x get_deps.sh
          ./get_deps.sh
          cd mkxp-z
          chmod +x make_xxd.sh
          ./make_xxd.sh

      # ── 8. Compile native dependencies (arm64-v8a) ───────────────────────────
      - name: Compile native deps — arm64-v8a (64-bit)
        working-directory: app/jni
        run: |
          HOST=aarch64-linux-android \
          TARGET=aarch64-linux-android \
          ABI=arm64-v8a \
          LDFLAGS="-Wl,-z,max-page-size=16384" \
          make -j$(nproc)
          # Asegurar mapeo de carpetas por si acaso
          if [ -d "build-arm64-v8a" ] && [ ! -d "build-arm64" ]; then ln -s build-arm64-v8a build-arm64; fi
          # Both Ruby 3.1 builds (r3 and r18) must exist, each in its own prefix.
          test -f build-arm64-v8a/lib/libruby.so
          test -f build-r18-arm64-v8a/lib/libruby.so
          if [ "$BUILD_R34" = "1" ]; then test -f build-r34-arm64-v8a/lib/libruby.so; fi

      # ── 8b. Compile native deps (armeabi-v7a, 32-bit phones) ─────────────────
      # AnyPlay: added so the APK also runs on 32-bit ARM phones.
      # (Application.mk and app/build.gradle already list armeabi-v7a.)
      - name: Compile native deps — armeabi-v7a (32-bit)
        working-directory: app/jni
        run: |
          # The dependency sources (pixman, openal, openssl, ruby...) are built IN-TREE and
          # stay configured for the previous ABI (arm64). Without a clean, make thinks
          # everything is already built and never creates build-armeabi-v7a/lib/*.
          # `make clean` only removes the in-tree build state; build-arm64-v8a/ is kept.
          make clean
          HOST=armv7a-linux-androideabi \
          TARGET=arm-linux-androideabi \
          ABI=armeabi-v7a \
          make -j$(nproc)
          ls -la build-armeabi-v7a/lib | head -30
          test -f build-armeabi-v7a/lib/libopenal.so
          test -d build-arm64-v8a/lib
          test -f build-armeabi-v7a/lib/libruby.so
          test -f build-r18-armeabi-v7a/lib/libruby.so
          test -f build-r18-arm64-v8a/lib/libruby.so
          if [ "$BUILD_R34" = "1" ]; then
            test -f build-r34-armeabi-v7a/lib/libruby.so
            test -f build-r34-arm64-v8a/lib/libruby.so
          fi

      # ── 9. Make Gradle wrapper executable ────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 10. Cache Gradle packages ─────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 11. Signing key (kept in GitHub Secrets, never in the repo) ───────────
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANYPLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/anyplay-release.keystore"
            echo "ANYPLAY_KEYSTORE_FILE=$RUNNER_TEMP/anyplay-release.keystore" >> "$GITHUB_ENV"
            echo "ANYPLAY_STORE_PASSWORD=${{ secrets.ANYPLAY_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANYPLAY_KEY_ALIAS=${{ secrets.ANYPLAY_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANYPLAY_KEY_PASSWORD=${{ secrets.ANYPLAY_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found: the APK will be signed with a temporary debug key."
          fi

      # ── 12. Build release APK ─────────────────────────────────────────────────
      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.suppressUnsupportedCompileSdk=34 \
            --no-daemon \
            --stacktrace

      # ── 12b. Pick the universal APK (64-bit + 32-bit) and give it its final name
      - name: Name the APK
        run: |
          find app/build/outputs/apk/release -name "*.apk"
          APK=$(find app/build/outputs/apk/release -name "*universal*.apk" | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1); fi
          cp "$APK" AnyPlay-RGSS-Plugin.apk
          echo "APK_PATH=AnyPlay-RGSS-Plugin.apk" >> "$GITHUB_ENV"

      # ── 12c. Check the native runtimes inside the final APK ──────────────────
      # r3 and r18 must each have their own libruby (SONAME libruby.so), each engine
      # must NEED libruby.so and export only SDL_main. Fails the build otherwise.
      - name: Verify runtime libraries in the APK
        # First Phase A build: report problems but do not block the release.
        # Remove this line once the check has been green on a real build.
        continue-on-error: true
        run: |
          chmod +x app/jni/verify-runtimes.sh
          app/jni/verify-runtimes.sh "$APK_PATH"

      # ── 13. Upload APK as artifact (always) ───────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyPlay-RGSS-Plugin
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── 14. Determine release tag ─────────────────────────────────────────────
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # ── 15. Create GitHub Release and upload APK ──────────────────────────────
      # The text of the release comes from RELEASE_NOTES.md in the repo: edit that
      # file before you create a new tag.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "AnyPlay RGSS Plugin ${{ steps.tag.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
