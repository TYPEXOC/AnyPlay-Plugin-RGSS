name: Build Tyranor RGSS Runtime

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - rgss-module
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (leave empty to build an artifact only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_NDK_VERSION: 23.2.8568313
      RUBY_VERSION: "3.1.3"

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Java (required by Gradle / Android SDK) ───────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. System dependencies ───────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake curl gpg xxd \
            autoconf automake libtool pkg-config \
            libgdbm-dev libncurses5-dev libreadline-dev zlib1g-dev \
            python3 git unzip

      # ── 4. Ruby  ──────────────────────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      # Ruby's 1.8.7 and 1.9.3 cross-build helpers validate their host Ruby
      # version against the target source tree. Keep the same host/target split
      # as MTool; those old host interpreters only run generators, so omit
      # optional extensions and avoid requiring obsolete OpenSSL packages.
      - name: Set up legacy Ruby build hosts
        shell: bash
        run: |
          curl -sSL https://get.rvm.io | bash -s stable --autolibs=disable --ignore-dotfiles
          source "$HOME/.rvm/scripts/rvm"
          rvm install 1.8.7 --autolibs=disable --with-out-ext=openssl,readline,gdbm,dbm
          rvm install 1.9.3 --autolibs=disable --with-out-ext=openssl,readline,gdbm,dbm
          rvm use 1.8.7 && ruby -v
          rvm use 1.9.3 && ruby -v

      # ── 5. Android SDK ────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # AnyPlay fix: the default package list ("tools platform-tools") fails with
          # "Failed to find package 'tools'" because 'tools' no longer exists.
          # Install nothing here; the NDK is installed by the next step.
          packages: ''

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      # ── 6. Export toolchain paths ─────────────────────────────────────────────
      - name: Export NDK toolchain paths
        run: |
          ARCH=linux-x86_64
          NDK_PATH="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/$ARCH/bin"
          echo "ANDROID_HOME=$ANDROID_HOME"           >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH"           >> "$GITHUB_ENV"
          echo "ARCH=$ARCH"                            >> "$GITHUB_ENV"
          echo "$TOOLCHAIN"                            >> "$GITHUB_PATH"

      # ── 7. Download JNI dependencies & Generate XXD ──────────────────────────
      - name: Download JNI dependencies (get_deps.sh)
        working-directory: app/jni
        run: |
          chmod +x get_deps.sh
          ./get_deps.sh
          cd mkxp-z
          chmod +x make_xxd.sh
          ./make_xxd.sh

      # ── 8. Compile native dependencies (arm64-v8a) ───────────────────────────
      - name: Compile native deps — arm64-v8a (64-bit)
        working-directory: app/jni
        run: |
          HOST=aarch64-linux-android \
          TARGET=aarch64-linux-android \
          ABI=arm64-v8a \
          LDFLAGS="-Wl,-z,max-page-size=16384" \
          make -j$(nproc)
          # Asegurar mapeo de carpetas por si acaso
          if [ -d "build-arm64-v8a" ] && [ ! -d "build-arm64" ]; then ln -s build-arm64-v8a build-arm64; fi

      # ── 8b. Compile native deps (armeabi-v7a, 32-bit phones) ─────────────────
      # AnyPlay: added so the APK also runs on 32-bit ARM phones.
      # (Application.mk and app/build.gradle already list armeabi-v7a.)
      - name: Compile native deps — armeabi-v7a (32-bit)
        working-directory: app/jni
        run: |
          # The dependency sources (pixman, openal, openssl, ruby...) are built IN-TREE and
          # stay configured for the previous ABI (arm64). Without a clean, make thinks
          # everything is already built and never creates build-armeabi-v7a/lib/*.
          # `make clean` only removes the in-tree build state; build-arm64-v8a/ is kept.
          make clean
          HOST=armv7a-linux-androideabi \
          TARGET=arm-linux-androideabi \
          ABI=armeabi-v7a \
          make -j$(nproc)
          ls -la build-armeabi-v7a/lib | head -30
          test -f build-armeabi-v7a/lib/libopenal.so
          test -d build-arm64-v8a/lib

      # ── 9. Make Gradle wrapper executable ────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 10. Cache Gradle packages ─────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 11. Signing key (kept in GitHub Secrets, never in the repo) ───────────
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANYPLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/anyplay-release.keystore"
            echo "ANYPLAY_KEYSTORE_FILE=$RUNNER_TEMP/anyplay-release.keystore" >> "$GITHUB_ENV"
            echo "ANYPLAY_STORE_PASSWORD=${{ secrets.ANYPLAY_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANYPLAY_KEY_ALIAS=${{ secrets.ANYPLAY_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANYPLAY_KEY_PASSWORD=${{ secrets.ANYPLAY_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found: the APK will be signed with a temporary debug key."
          fi

      # ── 12. Build release APK ─────────────────────────────────────────────────
      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.suppressUnsupportedCompileSdk=34 \
            --no-daemon \
            --stacktrace

      # ── 12b. Pick the universal APK (64-bit + 32-bit) and give it its final name
      - name: Name the APK
        run: |
          find app/build/outputs/apk/release -name "*.apk"
          APK=$(find app/build/outputs/apk/release -name "*universal*.apk" | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1); fi
          cp "$APK" Tyranor-RGSS-Runtime.apk
          echo "APK_PATH=Tyranor-RGSS-Runtime.apk" >> "$GITHUB_ENV"

      # ── 13. Upload APK as artifact (always) ───────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tyranor-RGSS-Runtime
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── 14. Determine release tag ─────────────────────────────────────────────
      - name: Resolve release tag
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # ── 15. Create GitHub Release and upload APK ──────────────────────────────
      # The text of the release comes from RELEASE_NOTES.md in the repo: edit that
      # file before you create a new tag.
      - name: Create GitHub Release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Tyranor RGSS Runtime ${{ steps.tag.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
