name: Build Tyranor RGSS Diagnostic APK

on:
  push:
    branches:
      - rgss-module
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_NDK_VERSION: 23.2.8568313
      RUBY_VERSION: "3.1.3"

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Java (required by Gradle / Android SDK) ───────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. System dependencies ───────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake curl xxd \
            autoconf automake libtool pkg-config \
            libgdbm-dev libncurses5-dev libreadline-dev zlib1g-dev \
            autotools-dev python3 git unzip

      # ── 4. Ruby  ──────────────────────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      # ── 5. Android SDK ────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # AnyPlay fix: the default package list ("tools platform-tools") fails with
          # "Failed to find package 'tools'" because 'tools' no longer exists.
          # Install nothing here; the NDK is installed by the next step.
          packages: ''

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      # ── 6. Export toolchain paths ─────────────────────────────────────────────
      - name: Export NDK toolchain paths
        run: |
          ARCH=linux-x86_64
          NDK_PATH="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/$ARCH/bin"
          echo "ANDROID_HOME=$ANDROID_HOME"           >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH"           >> "$GITHUB_ENV"
          echo "ARCH=$ARCH"                            >> "$GITHUB_ENV"
          echo "$TOOLCHAIN"                            >> "$GITHUB_PATH"

      # ── 7. Download JNI dependencies & Generate XXD ──────────────────────────
      - name: Download JNI dependencies (get_deps.sh)
        working-directory: app/jni
        run: |
          chmod +x get_deps.sh
          ./get_deps.sh
          cd mkxp-z
          chmod +x make_xxd.sh
          ./make_xxd.sh

      # ── 8. Compile native dependencies (arm64-v8a) ───────────────────────────
      - name: Compile native deps — arm64-v8a (64-bit)
        working-directory: app/jni
        run: |
          HOST=aarch64-linux-android \
          TARGET=aarch64-linux-android \
          ABI=arm64-v8a \
          LDFLAGS="-Wl,-z,max-page-size=16384" \
          make -j$(nproc)
          # Asegurar mapeo de carpetas por si acaso
          if [ -d "build-arm64-v8a" ] && [ ! -d "build-arm64" ]; then ln -s build-arm64-v8a build-arm64; fi
          test -f build-arm64-v8a/lib/libruby.so
          test -f build-arm64-v8a/lib/libruby187.so
          test -f build-arm64-v8a/lib/libruby193.so
          test -f build-arm64-v8a/lib/libsndfile.a
          test -f build-arm64-v8a/lib/libfluidsynth.so
          grep -Eq '^#define LIBSNDFILE_SUPPORT 1$' fluidsynth/cmakebuild-arm64-v8a/config.h
          grep -Eq '^#define LIBSNDFILE_HASVORBIS 1$' fluidsynth/cmakebuild-arm64-v8a/config.h

      # ── 8b. Compile native deps (armeabi-v7a, 32-bit phones) ─────────────────
      # AnyPlay: added so the APK also runs on 32-bit ARM phones.
      # (Application.mk and app/build.gradle already list armeabi-v7a.)
      - name: Compile native deps — armeabi-v7a (32-bit)
        working-directory: app/jni
        run: |
          # The dependency sources (pixman, openal, openssl, ruby...) are built IN-TREE and
          # stay configured for the previous ABI (arm64). Without a clean, make thinks
          # everything is already built and never creates build-armeabi-v7a/lib/*.
          # `make clean` only removes the in-tree build state; build-arm64-v8a/ is kept.
          make clean
          HOST=armv7a-linux-androideabi \
          TARGET=arm-linux-androideabi \
          ABI=armeabi-v7a \
          make -j$(nproc)
          ls -la build-armeabi-v7a/lib | head -30
          test -f build-armeabi-v7a/lib/libopenal.so
          test -f build-armeabi-v7a/lib/libruby.so
          test -f build-armeabi-v7a/lib/libruby187.so
          test -f build-armeabi-v7a/lib/libruby193.so
          test -f build-armeabi-v7a/lib/libsndfile.a
          test -f build-armeabi-v7a/lib/libfluidsynth.so
          grep -Eq '^#define LIBSNDFILE_SUPPORT 1$' fluidsynth/cmakebuild-armeabi-v7a/config.h
          grep -Eq '^#define LIBSNDFILE_HASVORBIS 1$' fluidsynth/cmakebuild-armeabi-v7a/config.h
          test -d build-arm64-v8a/lib

      # ── 9. Make Gradle wrapper executable ────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 10. Cache Gradle packages ─────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 11. Build diagnostic APK only ─────────────────────────────────────────
      - name: Build diagnostic APK
        run: |
          ./gradlew assembleDebug \
            -Pandroid.suppressUnsupportedCompileSdk=34 \
            --no-daemon \
            --stacktrace

      # ── 12. Name the diagnostic APK ────────────────────────────────────────────
      - name: Name the diagnostic APK
        run: |
          find app/build/outputs/apk/debug -name "*.apk"
          APK=$(find app/build/outputs/apk/debug -name "*universal*.apk" | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1); fi
          cp "$APK" Tyranor-RGSS-Debug.apk
          echo "DEBUG_APK_PATH=Tyranor-RGSS-Debug.apk" >> "$GITHUB_ENV"

      - name: Verify runtime libraries and MIDI SoundFont in APK
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            for library in libruby.so libruby187.so libruby193.so libfluidsynth.so; do
              unzip -Z1 "$DEBUG_APK_PATH" | grep -Fxq "lib/$abi/$library" || {
                echo "Missing lib/$abi/$library from $DEBUG_APK_PATH"
                exit 1
              }
            done
          done
          unzip -Z1 "$DEBUG_APK_PATH" | grep -Fxq "assets/GMGSx.SF2" || {
            echo "Missing bundled GMGSx.SF2 from $DEBUG_APK_PATH"
            exit 1
          }

      # ── 13. Upload diagnostic APK artifact ───────────────────────────────────
      - name: Upload diagnostic APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tyranor-RGSS-Debug
          path: ${{ env.DEBUG_APK_PATH }}
          retention-days: 30
